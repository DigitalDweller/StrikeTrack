name: StrikeTrack
options:
  bundleIdPrefix: com.striketrack
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  StrikeTrack:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - StrikeTrack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.striketrack.app
        INFOPLIST_FILE: StrikeTrack/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: StrikeTrack/Info.plist
    entitlements:
      path: StrikeTrack/StrikeTrack.entitlements
      properties:
        com.apple.security.app-sandbox: true
